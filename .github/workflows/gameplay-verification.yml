name: Gameplay verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rebuild/threejs-foundation]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and road-graph tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build
      - name: Test road graph and reverse navigation
        run: node --experimental-strip-types --test tests/*.test.mjs
